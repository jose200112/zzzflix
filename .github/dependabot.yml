version: 2

updates:
  # Frontend dependencies. Minor and patch updates are grouped into a single
  # pull request to keep the noise low.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Terraform providers (AWS, Cloudflare, GitHub)
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly

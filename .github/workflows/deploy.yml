name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue a la vez; si llega otro push, espera al actual
concurrency:
  group: deploy
  cancel-in-progress: false

# id-token: write permite pedir el token OIDC a GitHub
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}

      # TEMPORAL: borrar cuando el despliegue funcione
      - name: Debug OIDC (temporary)
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "AWS_ROLE_ARN length: ${#ROLE} (expected 52)"
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print({k: d.get(k) for k in ('sub', 'aud', 'iss', 'repository', 'ref')})
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/*"
